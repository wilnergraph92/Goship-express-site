# ==========================================================================
#  Préproduction (goship-staging) : migrations, contrôles, essai métier
# ==========================================================================
#  Toute migration passe ici AVANT la production (docs/production/deployment.md).
#  Dans l'ordre, et le premier échec arrête tout :
#    1. appliquer-chaine.sh : la chaîne outils/migrations.txt, fichier par fichier
#       (refuse l'adresse de la production) ;
#    2. controler.sh : sécurité + intégrité, en lecture seule ;
#    3. essai-metier.sql : comptes, rôles, colis, événements, verrous, scanner,
#       facture, paiements, espace client, suivi public, notifications, sante() —
#       dans UNE transaction annulée : rien ne reste, rien ne part ;
#    4. sonder.sh : les mêmes fonctions vues par l'API publique, et l'Auth.
#
#  Environnement GitHub « staging » :
#    secret   STAGING_DB_URL          chaîne de connexion de goship-staging
#    variable STAGING_SUPABASE_URL    https://<ref>.supabase.co de goship-staging
#    variable STAGING_SUPABASE_CLE    sa clé publishable (publique par conception)
#  Création du projet : docs/production/environment.md.
# ==========================================================================

name: Préproduction

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'outils/*.sql'
      - 'outils/migrations.txt'
      - 'outils/production/**'
      - '.github/workflows/preproduction.yml'

permissions:
  contents: read

concurrency:
  group: preproduction
  cancel-in-progress: false

jobs:
  preproduction:
    name: Chaîne, contrôles, essai métier
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      CIBLE_DB_URL: ${{ secrets.STAGING_DB_URL }}
      SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      SUPABASE_CLE: ${{ vars.STAGING_SUPABASE_CLE }}
    steps:
      - name: Préproduction configurée ?
        id: pret
        run: |
          if [ -z "$CIBLE_DB_URL" ] || [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_CLE" ]; then
            echo "::warning::Préproduction non configurée (environnement « staging » : STAGING_DB_URL, STAGING_SUPABASE_URL, STAGING_SUPABASE_CLE). Voir docs/production/environment.md."
            echo "pret=non" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$CIBLE_DB_URL$SUPABASE_URL" in
            *gpfdyslysqjmojgzggib*) echo "::error::STAGING pointe vers la PRODUCTION : arrêt."; exit 1 ;;
          esac
          echo "pret=oui" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.pret.outputs.pret == 'oui'
        with:
          sparse-checkout: |
            outils
            assets/js/config.js
          sparse-checkout-cone-mode: false

      - name: Outils (psql 17, age)
        if: steps.pret.outputs.pret == 'oui'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 age
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: 1. Chaîne des migrations
        if: steps.pret.outputs.pret == 'oui'
        run: bash outils/production/appliquer-chaine.sh

      - name: 2. Contrôles de sécurité et d'intégrité (lecture seule)
        if: steps.pret.outputs.pret == 'oui'
        run: bash outils/production/controler.sh resultat

      - name: 3. Essai métier (transaction annulée)
        if: steps.pret.outputs.pret == 'oui'
        run: |
          psql "$CIBLE_DB_URL" -X -q -v ON_ERROR_STOP=1 -f outils/production/essai-metier.sql 2>&1 \
            | sed -n 's/.*NOTICE:  //p; s/.*ERROR:  /ÉCHEC : /p'
          test "${PIPESTATUS[0]}" = 0

      - name: 4. L'API publique et l'Auth de la préproduction
        if: steps.pret.outputs.pret == 'oui'
        run: bash outils/production/sonder.sh
