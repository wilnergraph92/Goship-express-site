# ==========================================================================
#  Mise en ligne automatique du site : GitHub Pages et goshipexpress.net
# ==========================================================================
#  À chaque « push » sur la branche main, GitHub reconstruit le site et le
#  publie. Les fichiers de travail (SQL, applications mobile et de bureau,
#  README, outils) sont retirés avant publication : ils restent dans le dépôt, mais ne sont
#  jamais servis aux visiteurs — c'est ce que faisaient _redirects et
#  .htaccess, que GitHub Pages ne sait pas lire.
#
#  Le même site, contrôlé une seule fois, part aussi sur la branche
#  « hostinger », plus le .htaccess. Hostinger suit cette branche et met
#  goshipexpress.net à jour à chaque nouveau commit : aucun mot de passe
#  ni aucune clé Hostinger n'est rangé dans GitHub.
# ==========================================================================

name: Mettre le site en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:        # permet aussi de lancer la mise en ligne à la main

# Par défaut, lecture seule ; « publier » reçoit le droit d'écrire sur Pages,
# « envoyer-hostinger » celui de pousser la branche hostinger
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Préparer le site (sans les fichiers de travail)
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.claude' \
            --exclude '_site' \
            --exclude 'outils' \
            --exclude 'application-mobile' \
            --exclude 'bureau' \
            --exclude 'docs' \
            --exclude 'README.md' \
            --exclude 'CLAUDE.md' \
            --exclude 'CHANGELOG.md' \
            --exclude '.gitignore' \
            --exclude '.htaccess' \
            --exclude '_headers' \
            --exclude '_redirects' \
            --exclude '.DS_Store' \
            --exclude '*.command' \
            --exclude '*.py' \
            --exclude '*.sql'
          # Empêche GitHub de passer le site à Jekyll (qui masquerait les
          # dossiers commençant par « _ »). Depuis upload-pages-artifact v4, les
          # fichiers cachés (.nojekyll compris) ne partent plus dans l'artefact :
          # sans conséquence, une publication par deploy-pages ne passe jamais
          # par Jekyll. Gardé pour une publication par branche, si elle revenait.
          touch _site/.nojekyll
          echo "--- Fichiers publiés ---"
          ls _site

      # Garde-fou : rien de ce qui ne doit jamais partir en ligne (docs/production/secrets.md)
      - name: Contrôler ce qui part en ligne
        run: |
          interdits="$(cd _site && find . -type f \( -name '*.md' -o -name '*.sql' -o -name '*.py' -o -name '*.env' \
                       -o -name '.env*' -o -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.jks' \
                       -o -name '*.keystore' -o -name '*.age' -o -name '*.dump' \) | head -20)"
          if [ -n "$interdits" ]; then echo "Fichiers de travail dans le site publié :"; echo "$interdits"; exit 1; fi
          if grep -rEl 'sb_secret_[A-Za-z0-9_-]{8,}|-----BEGIN [A-Z ]*PRIVATE KEY-----' _site; then
            echo "Une clé secrète est dans le site publié : publication arrêtée."; exit 1
          fi
          python3 - <<'PY'
          import base64, json, re, pathlib, sys
          for f in pathlib.Path('_site').rglob('*.js'):
              for j in re.findall(r'eyJ[A-Za-z0-9_-]{8,}\.(eyJ[A-Za-z0-9_-]{8,})\.[A-Za-z0-9_-]{8,}', f.read_text(errors='ignore')):
                  try:
                      if json.loads(base64.urlsafe_b64decode(j + '=' * (-len(j) % 4))).get('role') == 'service_role':
                          sys.exit('Clé service_role dans %s : publication arrêtée.' % f)
                  except ValueError:
                      pass
          print('Aucun fichier de travail, aucune clé secrète dans le site publié.')
          PY

      - name: Envoyer le site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  # goshipexpress.net : le site contrôlé ci-dessus, tel quel, plus le .htaccess
  # (cache, page 404, fichiers de travail refusés). Un commit par mise en ligne,
  # jamais de « push --force » : Hostinger tire la branche, il ne la réécrit pas.
  envoyer-hostinger:
    needs: construire
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Deux mises en ligne rapprochées : la seconde attend la première, sinon
    # les deux commits se disputeraient la branche
    concurrency:
      group: hostinger
      cancel-in-progress: false
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Récupérer le site construit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artefact

      - name: Pousser le site sur la branche hostinger
        run: |
          site="$RUNNER_TEMP/site"
          branche="$RUNNER_TEMP/branche"
          mkdir -p "$site"
          tar -xf "$RUNNER_TEMP/artefact/artifact.tar" -C "$site"
          rm -f "$site/.nojekyll"            # propre à GitHub Pages
          cp .htaccess "$site/.htaccess"

          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin hostinger; then
            git worktree add -B hostinger "$branche" FETCH_HEAD
          else
            # Toute première fois : une branche sans lien avec main, qui part
            # d'un commit vide
            vide="$(git commit-tree -m "Branche de goshipexpress.net" "$(git hash-object -t tree /dev/null)")"
            git worktree add -B hostinger "$branche" "$vide"
          fi

          # La branche devient exactement le site : un fichier retiré du site
          # disparaît aussi de goshipexpress.net
          rsync -a --delete --exclude '.git' "$site/" "$branche/"
          cd "$branche"
          git add -A
          if git diff --cached --quiet; then
            echo "Rien n'a changé pour goshipexpress.net."
            exit 0
          fi
          git commit -q -m "Site publié depuis ${GITHUB_SHA::7} : $(git -C "$GITHUB_WORKSPACE" log -1 --format=%s)"
          git push origin hostinger
          echo "Branche hostinger à jour : Hostinger met goshipexpress.net à jour dans la minute."

  publier:
    needs: construire
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    outputs:
      adresse: ${{ steps.deploiement.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deploiement
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Juste après la mise en ligne : le site et la base répondent-ils ? En cas d'échec,
  # le workflow échoue (e-mail au propriétaire) : revenir à la version précédente
  # (docs/production/rollback.md).
  verifier:
    needs: publier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            assets/js/config.js
            outils/production
          sparse-checkout-cone-mode: false
      - name: Contrôle après publication
        run: bash outils/production/surveiller.sh "${{ needs.publier.outputs.adresse }}"
